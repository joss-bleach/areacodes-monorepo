name: Sandcastle

on:
  issues:
    types: [labeled]

# One planner run at a time. If a second Sandcastle label fires while a run is
# active, it queues rather than cancels — the queued run will pick up any
# remaining labelled issues once the first completes.
concurrency:
  group: sandcastle-planner
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  planner:
    if: github.event.label.name == 'Sandcastle'
    runs-on: ubuntu-latest

    env:
      BASE_BRANCH: ${{ vars.BASE_BRANCH || github.event.repository.default_branch }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.BASE_BRANCH || github.event.repository.default_branch }}
          # Full history so sandcastle/issue-* branches can fork correctly.
          fetch-depth: 0
          # Built-in token always has repo access; GH_PAT is passed separately
          # to the Vercel sandbox for pushing branches.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Sandcastle"
          git config user.email "sandcastle@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Run Sandcastle planner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # gh CLI in main.mts uses GH_TOKEN for label management on the runner.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Passed through to sandboxes for merger agent git push + gh operations.
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

        run: bun .sandcastle/main.mts

      # If the whole workflow crashes (network error, OOM, etc.) any issues
      # already transitioned to agent:in-progress need cleaning up.
      - name: Clean up stuck labels on crash
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue list \
            --label "agent:in-progress" \
            --state open \
            --json number \
            --jq '.[].number' \
          | while read -r n; do
              gh issue edit "$n" \
                --remove-label "agent:in-progress" \
                --add-label "agent:blocked"
              gh issue comment "$n" \
                --body "Sandcastle workflow crashed unexpectedly. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            done
